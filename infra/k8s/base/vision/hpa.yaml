apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: landmarknav-vision
  labels:
    app.kubernetes.io/name: landmarknav-vision
    app.kubernetes.io/component: vision-service
    app.kubernetes.io/part-of: landmarknav
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: landmarknav-vision
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
