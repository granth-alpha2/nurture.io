apiVersion: apps/v1
kind: Deployment
metadata:
  name: landmarknav-vision
  labels:
    app.kubernetes.io/name: landmarknav-vision
    app.kubernetes.io/component: vision-service
    app.kubernetes.io/part-of: landmarknav
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: landmarknav-vision
  template:
    metadata:
      labels:
        app.kubernetes.io/name: landmarknav-vision
        app.kubernetes.io/component: vision-service
        app.kubernetes.io/part-of: landmarknav
    spec:
      serviceAccountName: vision-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vision
          image: asia-south1-docker.pkg.dev/landmarknav/landmarknav/vision:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
            - name: ENVIRONMENT
              value: "production"
            - name: VISION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: landmarknav-vision-secrets
                  key: vision-api-key
                  optional: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
