apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: landmarknav-api
  labels:
    app.kubernetes.io/name: landmarknav-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: landmarknav
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: landmarknav-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
