apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: landmarks

resources:
  - namespace.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/hpa.yaml
  - api/pdb.yaml
  - api/serviceaccount.yaml
  - vision/deployment.yaml
  - vision/service.yaml
  - vision/hpa.yaml
  - vision/pdb.yaml
  - vision/serviceaccount.yaml
  - migrations/job.yaml
  - migrations/serviceaccount.yaml
  - networkpolicies/default-deny-all.yaml
  - networkpolicies/allow-dns.yaml
  - networkpolicies/allow-ingress-to-api.yaml
  - networkpolicies/allow-api-to-vision.yaml
  - networkpolicies/allow-api-to-external.yaml
  - networkpolicies/allow-vision-to-external.yaml
  - ingress/ingress.yaml
  - external-secrets/secret-store.yaml
  - external-secrets/api-secrets.yaml
  - external-secrets/vision-secrets.yaml
