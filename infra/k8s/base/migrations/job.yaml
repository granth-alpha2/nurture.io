apiVersion: batch/v1
kind: Job
metadata:
  name: landmarknav-db-migrate
  labels:
    app.kubernetes.io/name: landmarknav-db-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: landmarknav
  annotations:
    # ArgoCD or Helm hooks if applicable
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: landmarknav-db-migrate
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: migration-sa
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: asia-south1-docker.pkg.dev/landmarknav/landmarknav/api:latest
          command: ["npm", "run", "db:migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: landmarknav-api-secrets
                  key: database-url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
