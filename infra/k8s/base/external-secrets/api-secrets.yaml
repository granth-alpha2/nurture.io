apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: landmarknav-api-secrets
  labels:
    app.kubernetes.io/name: landmarknav-api
    app.kubernetes.io/part-of: landmarknav
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: landmarknav-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: landmarknav-database-url
    - secretKey: redis-url
      remoteRef:
        key: landmarknav-redis-url
    - secretKey: jwt-secret
      remoteRef:
        key: landmarknav-jwt-secret
