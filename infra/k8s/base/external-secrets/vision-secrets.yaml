apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: landmarknav-vision-secrets
  labels:
    app.kubernetes.io/name: landmarknav-vision
    app.kubernetes.io/part-of: landmarknav
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: landmarknav-vision-secrets
    creationPolicy: Owner
  data:
    - secretKey: vision-api-key
      remoteRef:
        key: landmarknav-vision-api-key
