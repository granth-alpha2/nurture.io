apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-api
  labels:
    app.kubernetes.io/part-of: landmarknav
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: landmarknav-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Allow ingress traffic from ingress-nginx or GKE ingress controller namespace / pods
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
