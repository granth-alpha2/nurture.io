apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: landmarknav-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: landmarknav
    environment: prod
spec:
  project: default
  source:
    repoURL: https://github.com/landmarknav/landmarknav.git
    targetRevision: main
    path: infra/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: landmarks
  syncPolicy:
    # Production allows automated self-heal, but prune requires explicit operator gate/approval
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
