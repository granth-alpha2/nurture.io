apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: landmarknav-stage
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: landmarknav
    environment: stage
spec:
  project: default
  source:
    repoURL: https://github.com/landmarknav/landmarknav.git
    targetRevision: main
    path: infra/k8s/overlays/stage
  destination:
    server: https://kubernetes.default.svc
    namespace: landmarks-stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
