apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: landmarks-dev

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: landmarknav-api
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: NODE_ENV
                    value: development
                  - name: LOG_LEVEL
                    value: debug
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: landmarknav-vision
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: vision
                env:
                  - name: ENVIRONMENT
                    value: development
                  - name: LOG_LEVEL
                    value: debug
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
  - patch: |-
      apiVersion: external-secrets.io/v1beta1
      kind: SecretStore
      metadata:
        name: gcp-secret-store
      spec:
        provider:
          gcpsm:
            projectID: landmarknav-dev
            auth:
              workloadIdentity:
                clusterLocation: asia-south1
                clusterName: dev-landmarknav-gke
images:
  - name: asia-south1-docker.pkg.dev/landmarknav/landmarknav/api
    newName: asia-south1-docker.pkg.dev/landmarknav-dev/landmarknav-dev/api
    newTag: dev-latest
  - name: asia-south1-docker.pkg.dev/landmarknav/landmarknav/vision
    newName: asia-south1-docker.pkg.dev/landmarknav-dev/landmarknav-dev/vision
    newTag: dev-latest
