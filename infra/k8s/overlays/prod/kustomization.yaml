apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: landmarks

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: landmarknav-api
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: NODE_ENV
                    value: production
                  - name: LOG_LEVEL
                    value: info
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: landmarknav-vision
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: vision
                env:
                  - name: ENVIRONMENT
                    value: production
                  - name: LOG_LEVEL
                    value: info
  - patch: |-
      apiVersion: external-secrets.io/v1beta1
      kind: SecretStore
      metadata:
        name: gcp-secret-store
      spec:
        provider:
          gcpsm:
            projectID: landmarknav-prod
            auth:
              workloadIdentity:
                clusterLocation: asia-south1
                clusterName: prod-landmarknav-gke
images:
  - name: asia-south1-docker.pkg.dev/landmarknav/landmarknav/api
    newName: asia-south1-docker.pkg.dev/landmarknav-prod/landmarknav-prod/api
    newTag: v1.0.0
  - name: asia-south1-docker.pkg.dev/landmarknav/landmarknav/vision
    newName: asia-south1-docker.pkg.dev/landmarknav-prod/landmarknav-prod/vision
    newTag: v1.0.0
