global:
  scrape_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: landmarknav-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:3000]

  - job_name: landmarknav-vision
    metrics_path: /metrics
    static_configs:
      - targets: [vision:8000]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
