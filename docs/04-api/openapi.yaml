openapi: 3.1.0
info:
  title: LandmarkNav API
  version: 0.1.0
  description: |
    Phase 1 local development API. Authentication is not implemented; keep all
    ports loopback-bound and never expose this demo service publicly. Places and
    walking routes are SYNTHETIC straight-line fixtures marked SIMULATED. They
    are not safe for real-world navigation. Visual localization is disabled.
servers:
  - url: http://127.0.0.1:3000
    description: Local Compose API only; unauthenticated and not for public exposure
security: []
paths:
  /v1/places/search:
    post:
      operationId: searchPlaces
      summary: Search for destination candidates
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceSearchRequest'
      responses:
        '200':
          description: SIMULATED destination candidates; not live provider data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceSearchResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/routes/walking:
    post:
      operationId: createWalkingRoute
      summary: Create a SIMULATED straight-line route between confirmed endpoints
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalkingRouteRequest'
      responses:
        '200':
          description: SIMULATED straight-line route; not a real pedestrian route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/routes/{routeId}:
    get:
      operationId: getWalkingRoute
      summary: Retrieve a current SIMULATED route
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: routeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '400':
          $ref: '#/components/responses/Problem'
        '200':
          description: Route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/sessions:
    post:
      operationId: createSession
      summary: Start a navigation session
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/sessions/{sessionId}:
    patch:
      operationId: updateSession
      summary: Pause or resume a navigation session
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdate'
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: endSession
      summary: End a session and initiate deletion per retention policy
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Session ended
        '404':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/localize:
    post:
      operationId: localize
      summary: Produce a GPS-only localization estimate or request relocalization
      description: Phase 1 accepts GPS and route evidence only. Visual frames are not accepted or processed.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalizationRequest'
      responses:
        '200':
          description: Estimate; uncertainty is represented explicitly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalizationEstimate'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/feedback:
    post:
      operationId: submitFeedback
      summary: Submit minimal user feedback
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '202':
          description: Feedback accepted for processing
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /healthz:
    get:
      operationId: health
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is alive
        '429':
          $ref: '#/components/responses/Problem'
  /readyz:
    get:
      operationId: readiness
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: Ready to serve
        '503':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics; keep the service bound to loopback in local development
      responses:
        '200':
          description: Prometheus exposition format. Keep this endpoint local-only.
        '429':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
  responses:
    Problem:
      description: RFC 7807 problem response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        requestId: { type: string }
    Coordinate:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    PlaceSearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 256 }
        sessionToken: { type: string, maxLength: 128 }
        near: { $ref: '#/components/schemas/Coordinate' }
    PlaceCandidate:
      type: object
      required: [providerPlaceId, displayName, location]
      properties:
        providerPlaceId: { type: string }
        displayName: { type: string }
        formattedAddress: { type: string }
        location: { $ref: '#/components/schemas/Coordinate' }
        attribution: { type: string }
    PlaceSearchResponse:
      type: object
      required: [mode, results]
      properties:
        mode: { type: string, enum: [SIMULATED] }
        results:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/PlaceCandidate' }
    WalkingRouteRequest:
      type: object
      required: [origin, destination]
      properties:
        origin: { $ref: '#/components/schemas/Coordinate' }
        destination: { $ref: '#/components/schemas/Coordinate' }
        language: { type: string, default: en }
    Route:
      type: object
      required: [routeId, mode, distanceMeters, durationSeconds, path, steps, warning]
      properties:
        routeId: { type: string, format: uuid }
        mode: { type: string, enum: [SIMULATED] }
        distanceMeters: { type: number, minimum: 0 }
        durationSeconds: { type: integer, minimum: 0 }
        path:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/Coordinate' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/RouteStep' }
        warning: { type: string }
    RouteStep:
      type: object
      required: [sequence, instruction, maneuver, distanceMeters, crossing]
      properties:
        sequence: { type: integer, minimum: 0 }
        instruction: { type: string, maxLength: 240 }
        maneuver: { type: string }
        distanceMeters: { type: number, minimum: 0 }
        crossing: { type: boolean, const: false }
    CreateSessionRequest:
      type: object
      required: [routeId]
      properties:
        routeId: { type: string, format: uuid }
        visualConsent: { type: boolean, default: false }
    Session:
      type: object
      required: [sessionId, routeId, state]
      properties:
        sessionId: { type: string, format: uuid }
        routeId: { type: string, format: uuid }
        state:
          type: string
          enum: [active, paused]
    SessionUpdate:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [active, paused] }
        routeId: { type: string, format: uuid, description: Optional validated replacement route for rerouting }
    LocalizationRequest:
      type: object
      required: [sessionId, location, horizontalAccuracyMeters, capturedAt]
      properties:
        sessionId: { type: string, format: uuid }
        location: { $ref: '#/components/schemas/Coordinate' }
        horizontalAccuracyMeters: { type: number, minimum: 0, maximum: 100000 }
        headingDegrees: { type: number, minimum: 0, maximum: 360 }
        routeStepSequence: { type: integer, minimum: 0 }
        visualConsent: { type: boolean, default: false }
        capturedAt: { type: string, format: date-time }
    Evidence:
      type: object
      required: [type, validated]
      properties:
        type: { type: string, enum: [gps, route] }
        validated: { type: boolean }
        source: { type: string }
    LocalizationEstimate:
      type: object
      required:
        [landmark_name, match_confidence, location_confirmed, distance_to_landmark_meters, next_instruction, next_maneuver, distance_to_next_maneuver_meters, requires_relocalization, evidence, model_version, mode]
      properties:
        landmark_name: { type: [string, 'null'] }
        match_confidence: { type: number, minimum: 0, maximum: 1, description: 'Ranking score, not probability' }
        location_confirmed: { type: boolean }
        distance_to_landmark_meters: { type: [number, 'null'], minimum: 0 }
        next_instruction: { type: [string, 'null'], maxLength: 240 }
        next_maneuver: { type: [string, 'null'] }
        distance_to_next_maneuver_meters: { type: [number, 'null'], minimum: 0 }
        requires_relocalization: { type: boolean }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/Evidence' }
        model_version: { type: string }
        mode: { type: string, enum: [GPS_ONLY] }
    FeedbackRequest:
      type: object
      required: [sessionId, category]
      properties:
        sessionId: { type: string, format: uuid }
        category:
          type: string
          enum: [wrong_instruction, confusing, accessibility, other]
        comment: { type: string, maxLength: 1000 }
