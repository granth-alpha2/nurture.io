name: Vision CI

on:
  pull_request:
    paths:
      - 'apps/vision/**'
      - '.github/workflows/ci-vision.yml'
  push:
    branches: [main]
    paths:
      - 'apps/vision/**'
      - '.github/workflows/ci-vision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report scaffold-only state
        if: ${{ hashFiles('apps/vision/pyproject.toml') == '' }}
        run: echo "Vision project manifest is not present; service checks begin in a later phase."
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('apps/vision/pyproject.toml') != '' }}
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        if: ${{ hashFiles('apps/vision/pyproject.toml') != '' }}
        working-directory: apps/vision
        run: python -m pip install -e '.[test]'
      - name: Lint and test
        if: ${{ hashFiles('apps/vision/pyproject.toml') != '' }}
        working-directory: apps/vision
        run: |
          python -m ruff check .
          python -m pytest
