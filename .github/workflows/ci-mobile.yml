name: Mobile CI

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ci-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ci-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report scaffold-only state
        if: ${{ hashFiles('apps/mobile/package.json') == '' }}
        run: echo "Mobile project manifest is not present; mobile checks begin in Phase 1."
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('apps/mobile/package.json') != '' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        if: ${{ hashFiles('apps/mobile/package.json') != '' }}
        run: npm ci --workspace=@landmarknav/mobile --include-workspace-root=false
      - name: Lint, typecheck, and test
        if: ${{ hashFiles('apps/mobile/package.json') != '' }}
        run: npm run verify --workspace=@landmarknav/mobile
