name: Documentation and diagrams

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render-diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked tooling
        run: npm ci
      - name: Validate repository YAML
        run: npm run validate:yaml
      - name: Render Mermaid diagrams
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: make diagrams
      - name: Ensure generated diagrams are present
        run: |
          count="$(find docs/diagrams/rendered -maxdepth 1 -type f -name '*.svg' | wc -l)"
          test "$count" -ge 16
          git diff --exit-code -- docs/diagrams/rendered
