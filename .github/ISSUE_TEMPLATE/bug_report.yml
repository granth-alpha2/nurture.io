name: Bug report
description: Report a reproducible issue without sharing sensitive location or camera data.
body:
  - type: markdown
    attributes:
      value: Do not include credentials, precise personal location, faces, license plates, or raw camera images.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and expected result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App version and device / environment
    validations:
      required: false
